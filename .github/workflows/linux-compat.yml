name: Compatibilidad de Linux

# Comprueba en qué distribuciones arranca DE VERDAD el paquete de Linux, en vez
# de deducirlo de la versión de glibc con la que se compiló. Cada distribución
# es un contenedor limpio: nada de lo que hay instalado en el runner cuenta.
#
# Es manual a propósito. Los tres jobs de release ya tardan lo suyo y esto no
# tiene por qué correr en cada etiqueta: interesa cuando cambia algo del
# empaquetado de Linux, cuando sale una distribución nueva, o cuando alguien
# reporta que no le arranca.
on:
  # Encadenado al build de Linux: si se construyen los paquetes, se prueban,
  # sin que nadie tenga que acordarse. No va colgado de la release porque los
  # tres jobs de publicación ya tardan lo suyo y esto solo importa cuando el
  # empaquetado de Linux cambia.
  workflow_run:
    workflows: ["Linux build check"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta a probar (vacío = la última publicada)"
        required: false
        default: ""
      run_id:
        description: "ID de un run de «Linux build check» para probar sus paquetes SIN publicar (tiene prioridad sobre la etiqueta)"
        required: false
        default: ""

jobs:
  probar:
    name: ${{ matrix.nombre }}
    # Un build que ha fallado no deja paquetes que probar, y la matriz entera
    # se caería descargando un artefacto que no existe.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    strategy:
      # Sin fail-fast: si falla en Ubuntu 22.04 queremos ver igualmente el
      # resultado de las otras cinco, que es justo la información que se busca.
      fail-fast: false
      matrix:
        include:
          # `soportada: no` no significa "esta no la probamos". Significa que
          # se comprueba que falle BIEN: que apt rechace el paquete en vez de
          # instalar algo que no abre. Un rojo aquí es un usuario engañado.
          - nombre: Ubuntu 22.04 LTS
            imagen: ubuntu:22.04
            familia: debian
            soportada: "no" # glibc 2.35, por debajo del mínimo
          - nombre: Ubuntu 24.04 LTS
            imagen: ubuntu:24.04
            familia: debian
            soportada: "si"
          - nombre: Debian 12 Bookworm
            imagen: debian:12
            familia: debian
            soportada: "no" # glibc 2.36, por debajo del mínimo
          - nombre: Debian 13 Trixie
            imagen: debian:13
            familia: debian
            soportada: "si"
          - nombre: Fedora 41
            imagen: fedora:41
            familia: fedora
            soportada: "si"
          - nombre: Arch Linux
            imagen: archlinux:latest
            familia: arch
            soportada: "si"

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      # Con `run_id` se prueban los paquetes de un build de CI, es decir ANTES
      # de publicar nada. Es la forma de comprobar un cambio de empaquetado sin
      # tener que sacar una release para verlo.
      - name: Descargar los paquetes de Linux
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          # Lanzado a mano con run_id, o encadenado detrás del build, que trae
          # el suyo en el propio evento.
          RUN_ID="${{ inputs.run_id }}"
          if [ -z "$RUN_ID" ] && [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          fi
          if [ -n "$RUN_ID" ]; then
            echo "Probando los paquetes del run $RUN_ID (sin publicar)"
            gh run download "$RUN_ID" --name vocript-linux-bundles --dir dist
            # El artefacto conserva el árbol de carpetas del bundler, y el
            # script busca por nombre en cualquier nivel, pero se aplana para
            # que el log se lea de un vistazo.
            find dist -type f \( -name '*.deb' -o -name '*.AppImage' \) -exec mv -t dist {} +
          else
            TAG="${{ inputs.tag }}"
            if [ -z "$TAG" ]; then
              TAG=$(gh release view --json tagName -q .tagName)
            fi
            echo "Probando $TAG"
            # Solo las copias de nombre fijo y el .deb: bajar además los archivos
            # versionados duplicaría 121 MB por cada distribución de la matriz.
            gh release download "$TAG" \
              --pattern "VoCript-x86_64.AppImage" \
              --pattern "*_amd64.deb" \
              --dir dist --clobber
          fi
          ls -lh dist/*.deb dist/*.AppImage

      # `shell: bash` en lugar del shell por defecto: trae `-o pipefail`, sin el
      # cual el código de salida del pipe es el de `tee` (siempre 0) y una
      # distribución donde VoCript no arranca se reportaría en verde.
      - name: Probar en ${{ matrix.nombre }}
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD/dist:/dist:ro" \
            -v "$PWD/tools/linux-compat:/tools:ro" \
            ${{ matrix.imagen }} \
            bash /tools/probar.sh ${{ matrix.familia }} ${{ matrix.soportada }} 2>&1 | tee salida.txt

      # Se escribe pase o falle: un fallo sin la salida delante obliga a abrir
      # el log del job para saber si fue la glibc o una biblioteca que falta.
      - name: Resumen
        if: always()
        run: |
          {
            echo "## ${{ matrix.nombre }} (\`${{ matrix.imagen }}\`)"
            echo ""
            echo '```'
            cat salida.txt 2>/dev/null || echo "(sin salida: el contenedor no llegó a arrancar)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
